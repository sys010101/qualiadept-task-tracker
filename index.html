<main>
  <title>Task Tracker Login</title>
  <h1>Task Tracker</h1>
  <div id="add-task-section">
    <class>login-container</class>
    <h2>Add New Task</h2>
    <input type="text" id="task-title" placeholder="Enter task name..." />
    <button type="button" data-testid="submit-btn">Submit Task</button>
  </div>
  <div class="login-container">
    <form>
      <input id="login-email" data-testid="input-email">
      <input id="login-password" type="password" data-testid="input-password">
      <button data-testid="btn-submit-login">Login</button>
    </form>
  </div>
</main>
